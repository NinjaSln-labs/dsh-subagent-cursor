# dsh-subagent-cursor bundle layer: registers the `cursor` SubagentProvider
# (Profile Bundle) AND its model-facing tool row — the provider itself is
# dormant (registers on ctx.subagents only); model-visible tools are separate
# `dsh-tool-subagent` rows. This bundle ships the correct tool row so users
# don't hand-write it:
#   - maxDepth: 'provider-managed' — REQUIRED. Cursor is an out-of-process
#     provider with capabilities.depthLimit=false; a numeric maxDepth (tool
#     default 3) fails mount loud ("provider cannot enforce maxDepth").
#   - backgroundMode: 'one-shot' — Cursor runs are one-shot; each call
#     is synchronous by default (waits for the result). The caller may still
#     opt into a background job per call via run_in_background: true; the tool
#     schema keeps that parameter visible. `continuable` is NOT supported and
#     fails mount loud.
- insert:
    - id: subagent-cursor
      name: 'dsh-subagent-cursor'
    - id: tool-subagent-cursor
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: cursor
        toolName: subagent_cursor
        maxDepth: provider-managed
        backgroundMode: one-shot
